[alembic]
script_location = agent-server/migrations
prepend_sys_path = agent-server
path_separator = os
sqlalchemy.url = sqlite+pysqlite:///./var/focusproof.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
