name: focusproof-staging

x-backend-image: &backend-image
  image: focusproof-agent-server:staging

services:
  postgres:
    image: postgres:16-bookworm@sha256:ec2448d32297f61000a4b70edc2d27c9dfaedfc28cee3b827233fd4f05392dc8
    restart: unless-stopped
    environment:
      POSTGRES_DB: focusproof
      POSTGRES_USER: focusproof
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - source: postgres_password
        mode: 0440
    volumes:
      - focusproof-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focusproof -d focusproof"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - private
    stop_grace_period: 30s

  clamd:
    image: clamav/clamav:1.4.3@sha256:75fb5fd95fcbe1d7e6d240c369c1572b686ee2c95949d1042b5148de8eddebb4
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clamdscan", "--ping=1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks:
      private:
        aliases: [clamd]
    stop_grace_period: 30s

  migrate:
    <<: *backend-image
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - source: postgres_password
        mode: 0440
    command:
      - /bin/sh
      - -ec
      - |
        export DATABASE_URL="postgresql+psycopg://focusproof:$$(cat /run/secrets/postgres_password)@postgres:5432/focusproof"
        cp /app/alembic.ini /tmp/alembic.ini
        sed -i "s|^sqlalchemy.url =.*|sqlalchemy.url = $${DATABASE_URL}|" /tmp/alembic.ini
        ALEMBIC_CONFIG=/tmp/alembic.ini alembic upgrade head
    networks:
      - private

  oidc-provider:
    image: quay.io/keycloak/keycloak:26.3.2@sha256:98fab020a3a490aba0978f237e2a06cd0ea42bf149c6cf10f11c0aaf27728ff2
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - -ec
    command:
      - |
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat /run/secrets/oidc_admin_password)"
        export FOCUSPROOF_TEST_USER_PASSWORD="$$(cat /run/secrets/oidc_test_user_password)"
        exec /opt/keycloak/bin/kc.sh start --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: focusproof-staging-admin
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: https://127.0.0.1:${FOCUSPROOF_STAGING_OIDC_HOST_PORT:?required}
      KC_HTTPS_CERTIFICATE_FILE: /run/secrets/oidc_tls_cert
      KC_HTTPS_CERTIFICATE_KEY_FILE: /run/secrets/oidc_tls_key
    secrets:
      - source: oidc_realm
        target: /opt/keycloak/data/import/focusproof-realm.json
        uid: "1000"
        gid: "1000"
        mode: 0440
      - source: oidc_admin_password
        uid: "1000"
        gid: "1000"
        mode: 0440
      - source: oidc_test_user_password
        uid: "1000"
        gid: "1000"
        mode: 0440
      - source: oidc_tls_cert
        uid: "1000"
        gid: "1000"
        mode: 0440
      - source: oidc_tls_key
        uid: "1000"
        gid: "1000"
        mode: 0440
    ports:
      - "127.0.0.1:${FOCUSPROOF_STAGING_OIDC_HOST_PORT:?required}:8443"
    healthcheck:
      test: ["CMD", "/bin/bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks:
      private:
        aliases: [oidc-provider]

  agent-server:
    <<: *backend-image
    build:
      context: ..
      dockerfile: deploy/agent-server.Dockerfile
      target: media
      args:
        SOURCE_DATE_EPOCH: "1735689600"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      oidc-provider:
        condition: service_healthy
      clamd:
        condition: service_healthy
    environment:
      FOCUSPROOF_PROFILE: staging
      FOCUSPROOF_MEDIA_ENABLED: "true"
      FOCUSPROOF_MEDIA_SCANNER_MODE: clamd
      FOCUSPROOF_CLAMD_ENDPOINT: tcp://clamd:3310
      FOCUSPROOF_DATA_DIR: /app/var
      FOCUSPROOF_OIDC_ISSUER: https://127.0.0.1:${FOCUSPROOF_STAGING_OIDC_HOST_PORT:?required}/realms/focusproof
      FOCUSPROOF_OIDC_AUDIENCE: focusproof-api
      FOCUSPROOF_OIDC_JWKS_URI: https://oidc-provider:8443/realms/focusproof/protocol/openid-connect/certs
      FOCUSPROOF_OIDC_ALLOWED_ALGORITHMS: RS256
      LITELLM_LOCAL_MODEL_COST_MAP: "true"
      SSL_CERT_FILE: /run/secrets/oidc_ca
    secrets:
      - source: postgres_password
        mode: 0440
      - source: oidc_fingerprint_key
        mode: 0440
      - source: oidc_ca
        mode: 0440
    volumes:
      - focusproof-openhands-data:/app/var
    command:
      - /bin/sh
      - -ec
      - |
        export DATABASE_URL="postgresql+psycopg://focusproof:$$(cat /run/secrets/postgres_password)@postgres:5432/focusproof"
        export FOCUSPROOF_OIDC_FINGERPRINT_KEY="$$(cat /run/secrets/oidc_fingerprint_key)"
        exec uvicorn focusproof.api.app:create_staging_test_app --factory --host 0.0.0.0 --port 8000 --workers 1
    ports:
      - "127.0.0.1:${FOCUSPROOF_STAGING_BACKEND_HOST_PORT:?required}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s
    networks:
      - private
    stop_grace_period: 30s

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        SOURCE_DATE_EPOCH: "1735689600"
        NEXT_PUBLIC_OIDC_ISSUER: ${NEXT_PUBLIC_OIDC_ISSUER:?required}
        NEXT_PUBLIC_OIDC_CLIENT_ID: ${NEXT_PUBLIC_OIDC_CLIENT_ID:?required}
        NEXT_PUBLIC_OIDC_AUDIENCE: ${NEXT_PUBLIC_OIDC_AUDIENCE:?required}
        NEXT_PUBLIC_OIDC_REDIRECT_URI: ${NEXT_PUBLIC_OIDC_REDIRECT_URI:?required}
    image: focusproof-frontend:staging
    restart: unless-stopped
    depends_on:
      agent-server:
        condition: service_healthy
    environment:
      FOCUSPROOF_API_BASE_URL: http://agent-server:8000
    ports:
      - "127.0.0.1:${FOCUSPROOF_STAGING_FRONTEND_HOST_PORT:?required}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s
    networks:
      - private
    stop_grace_period: 30s

secrets:
  postgres_password:
    file: ${FOCUSPROOF_STAGING_POSTGRES_PASSWORD_FILE}
  oidc_fingerprint_key:
    file: ${FOCUSPROOF_STAGING_OIDC_FINGERPRINT_KEY_FILE}
  oidc_realm:
    file: ${FOCUSPROOF_STAGING_OIDC_REALM_FILE:?required}
  oidc_admin_password:
    file: ${FOCUSPROOF_STAGING_OIDC_ADMIN_PASSWORD_FILE:?required}
  oidc_test_user_password:
    file: ${FOCUSPROOF_STAGING_OIDC_TEST_USER_PASSWORD_FILE:?required}
  oidc_tls_cert:
    file: ${FOCUSPROOF_STAGING_OIDC_TLS_CERT_FILE}
  oidc_tls_key:
    file: ${FOCUSPROOF_STAGING_OIDC_TLS_KEY_FILE}
  oidc_ca:
    file: ${FOCUSPROOF_STAGING_OIDC_CA_FILE}

volumes:
  focusproof-postgres-data:
  focusproof-openhands-data:

networks:
  private:
