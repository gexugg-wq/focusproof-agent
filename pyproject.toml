[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "focusproof-agent"
version = "0.1.0"
description = "OpenHands-inspired Python Agent Server scaffold for FocusProof learning verification."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi",
    "filelock>=3.16,<4",
    "httpx",
    "PyJWT[crypto]>=2.13,<3",
    "pydantic",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "uvicorn",
    "python-dotenv",
    "openhands-sdk==1.31.0",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["agent-server"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["agent-server"]

[tool.pytest.ini_options]
markers = [
    "real_llm: runs the separately authorized bounded OpenHands provider smoke",
    "postgres: requires an explicitly provided disposable PostgreSQL target",
    "staging_external: requires explicitly authorized external staging services",
]
