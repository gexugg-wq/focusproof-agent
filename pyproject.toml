[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "focusproof-agent"
version = "0.1.0"
description = "Official OpenHands SDK-backed Agent Server for general learning verification."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi",
    "filelock>=3.16,<4",
    "httpx",
    "PyJWT[crypto]>=2.13,<3",
    "pydantic",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "uvicorn",
    "python-dotenv",
    "openhands-sdk==1.31.0",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "ruff",
]
media = [
    "Pillow>=12.1.1,<13",
    "python-multipart>=0.0.20,<0.1",
]

[tool.setuptools.packages.find]
where = ["agent-server"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["agent-server"]

explicit_package_bases = true
exclude = ["^agent-server/tests/"]
[tool.pytest.ini_options]
addopts = "-m 'not real_llm and not real_asr and not postgres and not staging_external'"
markers = [
    "real_llm: runs the separately authorized bounded OpenHands provider smoke",
    "postgres: requires an explicitly provided disposable PostgreSQL target",
    "real_asr: runs the separately authorized real DashScope speech acceptance gate",
    "postgres_media: requires an explicitly provided disposable PostgreSQL media target",
    "staging_external: requires explicitly authorized external staging services",
]
